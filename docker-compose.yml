services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/site.db
    volumes:
      - ./data:/app/data
    expose:
      - '4321'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
