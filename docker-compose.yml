services:
  app:
    # Готовый образ из GitHub Actions: `docker compose pull && docker compose up -d`
    # собирать на сервере не нужно. `docker compose up -d --build` по-прежнему
    # собирает локально из исходников.
    image: ghcr.io/normss/profilewebnorm:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/site.db
    # Уникальный алиас в сети Docker: `app` — слишком частое имя сервиса. Если
    # подключить caddy к сети другого compose-проекта, где сервис тоже назван app,
    # встроенный DNS может вернуть чужой контейнер; по site-app коллизии нет.
    networks:
      default:
        aliases:
          - site-app
    volumes:
      - ./data:/app/data
    expose:
      - '4321'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    env_file: .env
    environment:
      # Пустой ALIAS_DOMAINS в .env сломал бы Caddyfile (блок сайта без адреса),
      # поэтому подставляем служебный .localhost: такие имена Caddy подписывает
      # внутренним сертификатом и в Let's Encrypt за ними не ходит.
      ALIAS_DOMAINS: ${ALIAS_DOMAINS:-alias.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Блоки для других приложений на этом сервере: ./deploy/local/*.caddy (не в git)
      - ./deploy/local:/etc/caddy/local:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
